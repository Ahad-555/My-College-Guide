<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل كليتي - جامعة الحدود الشمالية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #004d3d;
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f2f1 0%, #ffffff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* المربع الزجاجي الرئيسي */
        .main-card {
            width: 380px;
            height: 600px;
            background: var(--glass-bg);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        /* الخط الأخضر العلوي */
        .top-bar {
            width: 80%;
            height: 8px;
            background: var(--primary-green);
            border-radius: 0 0 10px 10px;
            position: absolute;
            top: 0;
        }

        /* محتوى شاشة التحميل */
        #loader-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            transition: opacity 0.8s ease;
        }

        .logo {
            width: 150px;
            margin-bottom: 20px;
        }

        .title {
            color: var(--primary-green);
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* نقاط التحميل */
        .dots-container {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: #ccc;
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1.2); opacity: 1; background: var(--primary-green); }
        }

        /* القائمة الرئيسية (مخفية في البداية) */
        #main-menu {
            display: none;
            width: 100%;
            padding-top: 40px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .menu-header {
            color: var(--primary-green);
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
        }

        .buttons-container {
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 0 auto;
        }

        .menu-btn {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
        }

        .menu-btn:active { transform: scale(0.98); }

        /* البار السفلي */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #eee;
            background: white;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #999;
        }

        .nav-item.active { color: var(--primary-green); }

        /* الحقوق خارج المربع */
        .footer-credits {
            position: absolute;
            bottom: 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
            line-height: 1.8;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="top-bar"></div>

        <!-- شاشة التحميل -->
        <div id="loader-screen">
            <img src="https://via.placeholder.com/150x150?text=LOGO" alt="Logo" class="logo"> <!-- استبدل باللوقو الخاص بك -->
            <div class="title">دليل كليتي</div>
            <div class="subtitle">بوابتك الشاملة لخدمات الكلية</div>
            <div class="dots-container">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <!-- القائمة الرئيسية -->
        <div id="main-menu">
            <img src="https://via.placeholder.com/80x80?text=LOGO" alt="Logo" class="logo" style="width: 80px; margin-bottom: 10px;">
            <div class="menu-header">القائمة الرئيسية</div>
            <hr style="width: 50px; border: 2px solid var(--primary-green); border-radius: 5px; margin-bottom: 25px;">
            
            <div class="buttons-container">
                <a href="#" class="menu-btn"><span>جدول دليل كليتي</span> <i class="fa-regular fa-calendar-days"></i></a>
                <a href="#" class="menu-btn"><span>الدليل السريع</span> <i class="fa-solid fa-rocket"></i></a>
                <a href="#" class="menu-btn"><span>حاسبة المعدل التفاعلية</span> <i class="fa-solid fa-chart-simple"></i></a>
                <a href="#" class="menu-btn"><span>النشرات والإعلانات</span> <i class="fa-regular fa-bell"></i></a>
                <a href="#" class="menu-btn"><span>اقترحي وقيمي</span> <i class="fa-regular fa-comment-dots"></i></a>
            </div>

            <div class="bottom-nav">
                <div class="nav-item active"><i class="fa-solid fa-house"></i><span>الرئيسية</span></div>
                <div class="nav-item"><i class="fa-regular fa-calendar"></i><span>الجدول</span></div>
                <div class="nav-item"><i class="fa-solid fa-calculator"></i><span>الحاسبة</span></div>
                <div class="nav-item"><i class="fa-solid fa-paper-plane"></i><span>الدليل</span></div>
                <div class="nav-item"><i class="fa-regular fa-bell"></i><span>الإعلانات</span></div>
            </div>
        </div>
    </div>

    <!-- الحقوق الثابتة بالأسفل -->
    <div class="footer-credits">
        تم تطوير هذا الموقع لخدمة طالبات جامعة الحدود الشمالية في رفحاء<br>
        دليل كليتي التفاعلي — © عهد الشمري 2026 | <i class="fa-solid fa-headset"></i> الدعم
    </div>

    <script>
        // منطق التحميل لمدة 7 ثواني
        setTimeout(function() {
            const loader = document.getElementById('loader-screen');
            const menu = document.getElementById('main-menu');
            
            loader.style.opacity = '0';
            
            setTimeout(() => {
                loader.style.display = 'none';
                menu.style.display = 'block';
                setTimeout(() => {
                    menu.style.opacity = '1';
                }, 50);
            }, 800);
            
        }, 7000); // 7000 مللي ثانية = 7 ثواني
    </script>
</body>
</html>
